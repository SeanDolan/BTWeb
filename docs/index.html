<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b29">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; worker-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'">
  <title>BTWeb · LED control</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">BTWEB / ESP32</p>
    <h1>A little light.<br>A direct connection.</h1>
    <p>Connect to MNQ-BT-0001 to control your board over Bluetooth.</p>
    <section aria-label="Connection">
      <p id="connection" role="status">Disconnected</p>
      <div class="actions">
        <button id="connect">Connect board</button>
        <button id="disconnect" disabled>Disconnect</button>
      </div>
    </section>
    <section aria-label="LED controls">
      <h2>Choose a colour</h2>
      <div class="colours">
        <button data-colour="255,0,0" class="red" disabled>Red</button>
        <button data-colour="0,255,0" class="green" disabled>Green</button>
        <button data-colour="0,0,255" class="blue" disabled>Blue</button>
        <button data-colour="0,0,0" disabled>Off</button>
      </div>
      <p id="state" aria-live="polite">Connect to read the board’s LED state.</p>
      <p id="message" role="status"></p>
    </section>
    <footer>Keep Bluefy in the foreground while controlling your board.</footer>
  </main>
</body>
</html>
